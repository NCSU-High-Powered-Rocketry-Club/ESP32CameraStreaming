; PlatformIO Project Configuration File
;
; This is the SENDER project (Seeed XIAO ESP32-S3 Sense with the camera).
;
; The receiver side is a SEPARATE nested project in ./receiver/ (ESP32-C3 "dish")
; with its own platformio.ini - PlatformIO does not allow per-environment source
; directories, so that's how the two boards are split.
;
; Build:
;   sender   :  pio run -e esp32s3_sense_sender && pio run -t upload -e esp32s3_sense_sender
;   receiver :  cd receiver && pio run -e esp32c3_receiver && pio run -t upload -e esp32c3_receiver
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3_sense_sender]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -Os
    -Wall
    -Wno-deprecated-declarations
lib_ldf_mode = chain+