; PlatformIO Project Configuration File
;
; This is the "dish" receiver project for the ESP32-C3 (Seeed XIAO ESP32-C3).
; It is intentionally a SEPARATE nested project from the S3 sender because
; PlatformIO does not allow per-environment src_dir overrides in one project
; file. Build it from this folder:
;
;   pio run && pio run -t upload
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32c3_receiver]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -Os
    -Wall
    -Wno-deprecated-declarations
lib_ldf_mode = chain+